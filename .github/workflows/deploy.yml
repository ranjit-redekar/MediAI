name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without a new commit.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs strictly from the lockfile, and npm only records the
      # optional native binaries for the platform the lockfile was generated on.
      # This lockfile was written on macOS, so `npm ci` on Linux would leave
      # Vite's rolldown binding (@rolldown/binding-linux-x64-gnu) uninstalled
      # and the build would fail. `npm install` resolves the right binary for
      # whichever platform the runner is on.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
