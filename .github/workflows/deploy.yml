name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without a new commit.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Vite 8 uses rolldown, whose native binding is an optional dependency
      # resolved per platform. npm only records the binding for the machine the
      # lockfile was generated on — this one is macOS — so installing from it on
      # Linux leaves @rolldown/binding-linux-x64-gnu missing and `vite build`
      # fails. Resolving without the lockfile lets npm pick the runner's binary.
      #
      # Vite is pinned to an exact version in package.json so dropping the
      # lockfile cannot drift us onto a different beta.
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
